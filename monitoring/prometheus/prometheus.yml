global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'hotel-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['hotel-backend:5000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['hotel-node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
